includes:
  - eval_safe_memory.yaml

navigation:
  stuck_waypoint_tolerance: 0.45
  stuck_final_waypoint_tolerance: 0.45
  trav_map_robot_radius_scale: 1.0
  doorway_clearance_radius_scale: 1.0
  clearance_aware_path: true
  clearance_aware_desired_clearance: 0.30
  clearance_aware_weight: 1.25
  clearance_aware_simplify: true
  rotate_when_already_in_navigation_region: true
  already_region_yaw_tolerance: 1.0
  already_reachable_max_goal_radius: 1.3

starter_primitives:
  native_stance_sample_attempts: 40
  symbolic_grasp_max_goal_radius: 1.2
  symbolic_grasp_max_yaw_error: 3.15
  explicit_navigation_max_goal_radius: 1.3
  explicit_grasp_use_object_navigation: true
  explicit_grasp_navigation_max_goal_radius: 1.3
  fixed_navigation_arm_pose_name: diagonal30
