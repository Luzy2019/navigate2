includes:
  - common.yaml
  - task.yaml

task:
  primitive_type: starter
  prompt_setting: v1

scene_graph:
  step_interval: 0

prompting:
  sections: [task, scene, objects, action]

navigation:
  already_reachable_max_goal_radius: 1.30

artifacts:
  save_video: true
  video_capture_interval: 30
  output_size: 512x512
  sensor_image_size: 1024x1024
  topdown_output_size: 1920x1080
  video_fps: 10
  save_surrounding_observations: true

safe_memory:
  # Default ablation profiles: (scene_graph, risk_predictor)
  # When neither --disable-scene-graph nor --disable-risk-predictor is passed
  # to the batch runner, it auto-generates both "full" and "baseline" profiles.
  timeout_seconds: 7200
  resume: false
  use_example_planning: false
  actions_file: null
